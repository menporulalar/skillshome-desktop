name: Release

# Builds SkillsHome Desktop for macOS (Apple Silicon + Intel), Windows, and Linux,
# and attaches the installers to a GitHub Release. Triggered by pushing a `v*` tag.
#
# These builds are UNSIGNED at the OS level (no Apple notarization, no Windows
# code-signing cert configured yet — see README.md). macOS Gatekeeper and Windows
# SmartScreen will warn on first launch; that's expected until signing is set up as
# a fast-follow.
#
# NOTE — two unrelated things are both called "signing" here. The above is OS
# code-signing (Gatekeeper/SmartScreen trust), still absent. Separately, #28 added
# UPDATER signing: the minisign keypair that lets the app verify an update package
# against the pubkey in tauri.conf.json. Updater signing is configured and verified;
# it does nothing for Gatekeeper warnings, and OS notarization would do nothing for
# update verification.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      # The frontend imports brand tokens (src/App.css, the LIGHT_THEME imports),
      # so the build fails outright without this. Only `brand` (public) is needed
      # — `specs` is docs-only and private, so a blanket `submodules: true` fails
      # there with no repo access. Rewrite git@github.com: -> https:// ourselves
      # since we're not using checkout's own submodules option: the runner has no
      # SSH key, but brand is public so unauthenticated HTTPS works.
      - name: Check out brand submodule
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init brand

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust build cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Stage bundled sidecar (macOS)
        if: matrix.platform == 'macos-latest'
        env:
          # sidecar/.npmrc maps @menporulalar to GitHub Packages via this var.
          # agents-core is published from skillshome-app, a different repo, so the
          # automatic per-run token only works if that package's "Manage Actions
          # access" has explicitly granted skillshome-desktop read access — a
          # one-time GitHub UI/API step, not something this workflow can do itself.
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd sidecar
          npm ci
          npm run bundle
          cd ..
          mkdir -p src-tauri/resources/sidecar/dist
          cp sidecar/dist/*.cjs src-tauri/resources/sidecar/dist/

          # The embedded `node` must match the Mac architecture this matrix leg is
          # building for (matrix.args' --target), not the CI runner's own arch:
          # macos-latest runners are arm64, but the x86_64-apple-darwin leg builds
          # for Intel Macs, where an arm64 node binary simply can't run.
          case "${{ matrix.args }}" in
            *aarch64*) NODE_ARCH=arm64 ;;
            *x86_64*) NODE_ARCH=x64 ;;
          esac
          NODE_VERSION=$(node --version | sed 's/^v//')
          curl -fsSL "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-darwin-${NODE_ARCH}.tar.gz" -o /tmp/node.tar.gz
          tar -xzf /tmp/node.tar.gz -C /tmp
          cp "/tmp/node-v${NODE_VERSION}-darwin-${NODE_ARCH}/bin/node" src-tauri/resources/sidecar/node
          chmod +x src-tauri/resources/sidecar/node

      - name: Stage bundled sidecar (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        env:
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd sidecar
          npm ci
          npm run bundle
          cd ..
          mkdir -p src-tauri/resources/sidecar/dist
          cp sidecar/dist/*.cjs src-tauri/resources/sidecar/dist/

          # ubuntu-22.04 has no cross-arch matrix split (unlike macOS) — it only
          # ever builds for its own runner's native x64, so the runner's own node
          # is always the right architecture.
          cp "$(command -v node)" src-tauri/resources/sidecar/node
          chmod +x src-tauri/resources/sidecar/node

      - name: Stage bundled sidecar (Windows)
        if: matrix.platform == 'windows-latest'
        shell: bash
        env:
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd sidecar
          npm ci
          npm run bundle
          cd ..
          mkdir -p src-tauri/resources/sidecar/dist
          cp sidecar/dist/*.cjs src-tauri/resources/sidecar/dist/

          # windows-latest, like ubuntu-22.04, has no cross-arch matrix split —
          # the runner's own node.exe is always the right architecture. tauri.
          # windows.conf.json maps this to "sidecar/node.exe" (not "sidecar/node",
          # the macOS/Linux name) via a platform-specific bundle.resources override.
          cp "$(command -v node)" src-tauri/resources/sidecar/node.exe

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Baked in at compile time via Rust's option_env! (src-tauri/src/auth/backend_client.rs) —
          # unset here, v0.1.0 silently compiled with the http://localhost:3000 fallback, so
          # sign-in appeared to work through the browser step then failed reaching the backend.
          SKILLSHOME_BACKEND_URL: https://app.skillshome.me
          # Desktop-type Google OAuth client (separate registration from skillshome-app's web
          # client — see src-tauri/src/auth/google.rs). Also never set in v0.1.0/v0.1.1, so
          # "Sign in with Google" showed "GOOGLE_DESKTOP_CLIENT_ID is not configured for this
          # build" instead of opening the browser consent screen. Not a secret — this is a
          # public OAuth client_id, safe as a plain workflow value (unlike CLIENT_SECRET, which
          # only skillshome-app's server needs, never this binary).
          GOOGLE_DESKTOP_CLIENT_ID: 615658998656-l3rmtbvpstu8q0nfrujitihe0v6ugk4d.apps.googleusercontent.com
          # Separate GitHub OAuth App (Device Flow enabled, no callback URL needed — device
          # flow polls github.com/login/device directly). Same "never wired into release.yml"
          # gap as the two vars above; also not a secret, no client_secret needed for this flow.
          GITHUB_DEVICE_CLIENT_ID: Ov23liHl2gkZau28nsAu
          # R2 — Feature #28 auto-update signing. The secret's value is the VERBATIM
          # CONTENTS of src-tauri/.tauri-keys (`cat .tauri-keys | pbcopy`) — that file is
          # ALREADY a base64 blob. Do NOT run it through base64 again: the CLI applies
          # exactly one decode (helpers/updater_signature.rs decode_key), so a
          # double-encoded value fails with the misleading error "incorrect updater
          # private key password: Missing encoded key in secret key" — which points at
          # the password, not the real cause. Never commit the key itself.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # If a password was used when generating the keypair, provide it here as a secret.
          # The current keypair has no password — leave this unset or empty.
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          # Only tagged runs publish. `github.ref_name` is the BRANCH name on a
          # workflow_dispatch, so the previous unconditional value would have made
          # tauri-action create a git tag literally named `main` plus a draft
          # release "SkillsHome Desktop main" — and a tag named `main` alongside the
          # branch makes every later `git checkout main` / `git push origin main`
          # ambiguous until someone deletes it.
          #
          # Passing an empty tagName makes tauri-action build without creating any
          # release, which is what a manual run should do: it exercises the whole
          # build (submodule checkout, sidecar staging, Rust/Tauri bundling) and
          # leaves nothing behind. Use workflow_dispatch to smoke-test the build;
          # push a `v*` tag to actually publish.
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: ${{ github.ref_type == 'tag' && format('SkillsHome Desktop {0}', github.ref_name) || '' }}
          releaseBody: |
            ## SkillsHome Desktop ${{ github.ref_name }}

            **These installers are currently unsigned.** You'll see an OS security
            warning on first launch — this is expected, not a sign of a bad download:

            - **macOS**: Gatekeeper will say the app "cannot be opened because it is
              from an unidentified developer." Right-click (or Control-click) the app
              → **Open** → **Open** again in the confirmation dialog.
              - **If instead you see "is damaged and can't be opened"** — that's a
                different Gatekeeper message (common on newer macOS / Apple Silicon)
                and the right-click trick above won't help. Run this in Terminal, then
                launch normally: `xattr -cr /Applications/SkillsHome\ Desktop.app`
                (adjust the path if it's not in `/Applications` yet). The app isn't
                actually damaged — this just clears the quarantine flag.
            - **Windows**: SmartScreen will show "Windows protected your PC." Click
              **More info** → **Run anyway**.

            Proper code signing (Apple notarization + a Windows code-signing
            certificate) is a planned fast-follow — see the README.

            Choose the download for your platform below.
          # Draft while the updater rollout is being validated (#28). A draft is not
          # served by `releases/latest/download/...`, which is the updater endpoint —
          # so nothing reaches existing installs until a human promotes the release.
          # Inspect the attached latest.json first, then publish to go live.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
